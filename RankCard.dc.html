<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-152c16f1-5ed9-45c3-9ec2-c048974330c9/styles.css">
  <script src="_ds/industry-152c16f1-5ed9-45c3-9ec2-c048974330c9/_ds_bundle.js"></script>
</helmet>
<article class="card blueprint rank-card {{ co.pinnedClass }}">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <div class="rank-num">
    <div class="n">{{ co.rankLabel }}</div>
    <div class="logo-mark">{{ co.initials }}</div>
  </div>
  <div>
    <div class="rank-head">
      <h3><a href="{{ co.ctaUrl }}" target="_blank" rel="noopener">{{ co.name }}</a></h3>
      <span class="rank-score">{{ co.score }}</span>
    </div>
    <div class="rank-tags">
      <sc-for list="{{ co.tags }}" as="t" hint-placeholder-count="2">
        <span class="tag tag-outline">{{ t }}</span>
      </sc-for>
    </div>
    <p class="desc">{{ co.description }}</p>
    <sc-if value="{{ co.whyPinned }}" hint-placeholder-val="{{ false }}">
      <div class="why-box"><strong>{{ co.whyLabel }}</strong>{{ co.whyPinned }}</div>
    </sc-if>
    <ul class="rank-strengths">
      <sc-for list="{{ co.strengths }}" as="s" hint-placeholder-count="4">
        <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 6 9 17l-5-5"/></svg><span>{{ s }}</span></li>
      </sc-for>
    </ul>
  </div>
  <div class="rank-side">
    <div class="meta-row"><span>Founded</span><span>{{ co.founded }}</span></div>
    <div class="meta-row"><span>HQ</span><span>{{ co.hq }}</span></div>
    <div class="meta-row"><span>Best for</span><span>{{ co.bestFor }}</span></div>
    <div class="meta-row"><span>Delivery</span><span>{{ co.delivery }}</span></div>
    <a class="btn btn-primary blueprint btn-block" href="{{ co.ctaUrl }}" target="_blank" rel="noopener"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>{{ co.ctaLabel }}</a>
  </div>
</article>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:320}}"></script>
</body>
</html>
